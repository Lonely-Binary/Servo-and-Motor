; PlatformIO project for the PCA9685 16-Channel 12-Bit PWM Servo Driver.
;
; src_dir points at one of the Arduino sketches, so there is only ever one copy
; of each example. Change it to build a different one:
;
;   ../arduino/01-single-servo
;   ../arduino/02-sweep-all
;   ../arduino/03-serial-console
;   ../arduino/04-multi-board-hotplug
;
; Then:  pio run -t upload && pio device monitor

[platformio]
src_dir = ../arduino/03-serial-console

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    adafruit/Adafruit PWM Servo Driver Library
    adafruit/Adafruit BusIO
